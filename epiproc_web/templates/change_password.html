{% extends 'base.html' %}

{% block content %}
<section class="card form-card">
    <h2>Cambio obligatorio de contraseña</h2>
    <p>Por seguridad, debes actualizar tu contraseña antes de continuar.</p>

    <form method="post" class="form-grid" novalidate>
        <label>Contraseña actual
            <input type="password" name="current_password" required minlength="8" autocomplete="current-password">
        </label>

        <label>Nueva contraseña
            <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
        </label>

        <label>Confirmar nueva contraseña
            <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
        </label>

        <button type="submit" class="btn btn-primary">Guardar nueva contraseña</button>
    </form>
</section>
{% endblock %}
